; Configuración de replicación DDS de DDM (ADR-012 / RF-DDS-006, ICD §8)
;
; [general]/environment selecciona el perfil activo (sección homónima).
; Cada perfil define:
;   domain_id  — Domain ID de DDS (entero). DDM lo lee y lo inyecta al
;                constructor de ReplicationEngine (DA-03 cerrada).
;   console_id — ID de esta consola en la red de replicación (entero).
;                Viaja como source_console_id en cada Envelope (ICD §6.2).
;                NO confundir con el "tipo" (meko) de overlay.json, que es
;                para otra función.

[general]
environment = dev

[dev]
domain_id = 42
console_id = 1

[test]
domain_id = 100
console_id = 1

[prod]
domain_id = 0
console_id = 1
