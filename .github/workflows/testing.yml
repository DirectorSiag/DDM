name: Tests para DDM
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
jobs:
  build-linux:
    name: Compilar en Debian
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
    - name: Instalar dependencias base
      run: |
        apt-get update -qq
        apt-get install -y sudo git curl python3 python3-pip python3-venv \
          libgl1-mesa-dev libglu1-mesa-dev build-essential \
          libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Instalar aqtinstall (usando el Python del sistema, no el de GitHub)
      run: pip3 install aqtinstall --break-system-packages

    - name: Instalar Qt 6.5 para Linux
      run: |
        python3 -m aqt install-qt linux desktop 6.5.3 gcc_64 -O /opt/qt
        echo "/opt/qt/6.5.3/gcc_64/bin" >> $GITHUB_PATH

    - name: Compilar en Debian
      run: |
        mkdir build
        cd build
        qmake ../DDM.pro
        make -j$(nproc)

    - name: Subir Artefacto Linux
      uses: actions/upload-artifact@v4
      with:
        name: DDM-Linux-Debug
        path: build/
